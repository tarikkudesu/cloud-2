services:
  nginx:
    build: requirements/nginx
    container_name: nginx
    image: nginx:tar
    env_file:
      - .env
    depends_on:
      - wordpress
    ports:
      - target: 80
        published: 80
      - target: 443
        published: 443
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception
    restart:
      on-failure

  mariadb:
    build: requirements/mariadb
    container_name: mariadb
    image: mariadb:tar
    env_file:
      - .env
    volumes:
      - db:/var/lib/mysql
    networks:
      - inception
    restart:
      on-failure

  wordpress:
    build: requirements/wordpress
    container_name: wordpress
    image: wordpress:tar
    env_file:
      - .env
    depends_on:
      - mariadb
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception
    restart:
      on-failure

  phpmyadmin:
    image: phpmyadmin:5.2.3
    container_name: phpmyadmin
    depends_on:
      - mariadb
    ports:
      - target: 80
        published: 8080
        host_ip: 127.0.0.1
    environment:
      PMA_HOST: mariadb
      PMA_PORT: "3306"
      PMA_USER: "${INCEPTION_MYSQL_USER}"
      PMA_PASSWORD: "${INCEPTION_MYSQL_PASS}"
    networks:
      - inception
    restart:
      on-failure

volumes:
  wordpress:
    name: wordpress
    driver: local
    driver_opts:
      type: bind
      o: bind
      device: "/home/data/wordpress"
  db:
    name: db
    driver: local
    driver_opts:
      type: bind
      o: bind
      device: "/home/data/database"

networks:
  inception:
    name: inception
    driver: bridge
