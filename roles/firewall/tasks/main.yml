---
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true
  become: true

- name: Default deny incoming
  community.general.ufw:
    default: deny
    direction: incoming

- name: Allow Port 443
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: 'tcp'
  loop: "{{ firewall_allowed_tcp_ports }}"

- name: Firewall management
  community.general.ufw:
    state: enabled
